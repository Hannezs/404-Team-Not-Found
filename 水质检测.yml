    - data:
        code: "def main(source_name, source_type: str, description: str, recent_turbidity_data:\
          \ str):\n    \"\"\"\n    预处理浊度数据并验证有效性，适配 Dify 工作流节点\n    参数说明:\n    - source_name:\
          \ 数据源名称\n    - source_type: 数据源类型  \n    - description: 数据描述\n    - recent_turbidity_data:\
          \ 最近的浊度数据字符串，逗号分隔\n    \"\"\"\n    try:\n        print(f\"数据源信息: {source_name},\
          \ {source_type}\")\n        print(f\"接收到的浊度数据: {recent_turbidity_data}\"\
          )\n\n        # 处理可能的空值\n        source_name = source_name or \"\"\n    \
          \    source_type = source_type or \"\"\n        description = description\
          \ or \"\"\n        recent_turbidity_data = recent_turbidity_data or \"\"\
          \n\n        if not recent_turbidity_data.strip():\n            return {\n\
          \                \"output\": {\n                    \"is_valid\": False,\n\
          \                    \"error_reason\": \"无有效的浊度数据\",\n                 \
          \   \"data_count\": 0,\n                    \"values\": [],\n          \
          \          \"source_info\": {\n                        \"name\": source_name,\n\
          \                        \"type\": source_type,\n                      \
          \  \"description\": description\n                    }\n               \
          \ }\n            }\n\n        values = [x.strip() for x in recent_turbidity_data.split(\"\
          ,\") if x.strip()]\n        turbidity_values = []\n        for val in values:\n\
          \            try:\n                num_val = float(val)\n              \
          \  turbidity_values.append(num_val)\n            except ValueError:\n  \
          \              print(f\"忽略无效数值: {val}\")\n                continue\n\n \
          \       if not turbidity_values:\n            return {\n               \
          \ \"output\": {\n                    \"is_valid\": False,\n            \
          \        \"error_reason\": \"解析后无有效数据\",\n                    \"data_count\"\
          : 0,\n                    \"values\": [],\n                    \"source_info\"\
          : {\n                        \"name\": source_name,\n                  \
          \      \"type\": source_type,\n                        \"description\":\
          \ description\n                    }\n                }\n            }\n\
          \n        latest_value = turbidity_values[0]\n        avg_value = sum(turbidity_values)\
          \ / len(turbidity_values)\n        max_value = max(turbidity_values)\n \
          \       min_value = min(turbidity_values)\n\n        # 趋势分析\n        trend\
          \ = \"稳定\"\n        if len(turbidity_values) > 1:\n            change =\
          \ latest_value - turbidity_values[-1]\n            change_percent = (change\
          \ / turbidity_values[-1]) * 100 if turbidity_values[-1] != 0 else 0\n  \
          \          if change_percent > 10:\n                trend = \"明显上升\"\n \
          \           elif change_percent > 5:\n                trend = \"上升\"\n \
          \           elif change_percent < -10:\n                trend = \"明显下降\"\
          \n            elif change_percent < -5:\n                trend = \"下降\"\n\
          \n        return {\n            \"output\": {\n                \"is_valid\"\
          : True,\n                \"data_count\": len(turbidity_values),\n      \
          \          \"values\": turbidity_values,\n                \"latest_value\"\
          : round(latest_value, 2),\n                \"average_value\": round(avg_value,\
          \ 2),\n                \"max_value\": round(max_value, 2),\n           \
          \     \"min_value\": round(min_value, 2),\n                \"trend\": trend,\n\
          \                \"unit\": \"NTU\",\n                \"source_info\": {\n\
          \                    \"name\": source_name,\n                    \"type\"\
          : source_type,\n                    \"description\": description\n     \
          \           }\n            }\n        }\n\n    except Exception as e:\n\
          \        return {\n            \"output\": {\n                \"is_valid\"\
          : False,\n                \"error_reason\": f\"数据处理错误: {str(e)}\",\n   \
          \             \"data_count\": 0,\n                \"values\": [],\n    \
          \            \"source_info\": {\n                    \"name\": source_name\
          \ or \"\",\n                    \"type\": source_type or \"\",\n       \
          \             \"description\": description or \"\"\n                }\n\
          \            }\n        }"
        code_language: python3
