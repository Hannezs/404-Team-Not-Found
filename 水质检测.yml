    - data:
        code: "import json\n\ndef main(inputs):\n    \"\"\"\n    基于浊度值进行水质分析和等级判断，适配\
          \ Dify 工作流\n    \"\"\"\n    try:\n        turbidity = inputs.get(\"latest_value\"\
          )\n        trend = inputs.get(\"trend\", \"未知\")\n\n        if turbidity\
          \ is None:\n            raise ValueError(\"缺少 latest_value 输入\")\n\n   \
          \     # 水质分级标准\n        if turbidity < 1:\n            level, level_en,\
          \ color, risk = \"优秀\", \"Excellent\", \"#10B981\", \"低风险\"\n          \
          \  standard = \"饮用水标准\"\n        elif turbidity < 5:\n            level,\
          \ level_en, color, risk = \"良好\", \"Good\", \"#3B82F6\", \"低风险\" \n    \
          \        standard = \"生活用水标准\"\n        elif turbidity < 10:\n         \
          \   level, level_en, color, risk = \"中等\", \"Fair\", \"#F59E0B\", \"中风险\"\
          \n            standard = \"一般用水标准\"\n        elif turbidity < 20:\n    \
          \        level, level_en, color, risk = \"较差\", \"Poor\", \"#EF4444\", \"\
          高风险\"\n            standard = \"需处理用水\"\n        else:\n            level,\
          \ level_en, color, risk = \"严重污染\", \"Severe\", \"#7F1D1D\", \"极高风险\"\n\
          \            standard = \"不宜使用\"\n\n        # 建议内容\n        suggestion_map\
          \ = {\n            \"优秀\": \"水质极佳，符合直接饮用标准，建议继续保持当前监测频率。\",\n          \
          \  \"良好\": \"水质良好，适合日常生活使用，建议定期监测确保水质稳定。\",\n            \"中等\": \"建议进行过滤处理后再使用，并增加监测频率至每日一次。\"\
          , \n            \"较差\": \"需要经过专业水处理设备处理，建议立即排查污染源。\",\n            \"严重污染\"\
          : \"严禁使用，需立即采取应急治理措施并上报相关部门。\"\n        }\n\n        # 警报判断\n        is_alert\
          \ = turbidity > 10\n        alert_level = \"high\" if turbidity > 20 else\
          \ \"medium\" if turbidity > 10 else \"none\"\n        alert_message = generate_alert_message(level,\
          \ turbidity, trend)\n\n        result_data = {\n            \"quality_level\"\
          : level,\n            \"quality_level_en\": level_en,\n            \"risk_level\"\
          : risk,\n            \"color_code\": color,\n            \"standard_reference\"\
          : standard,\n            \"suggestion\": suggestion_map.get(level, \"请进行专业水质检测分析\"\
          ),\n            \"is_alert\": is_alert,\n            \"alert_level\": alert_level,\n\
          \            \"alert_message\": alert_message\n        }\n\n        return\
          \ {\n            \"output\": json.dumps(result_data, ensure_ascii=False)\n\
          \        }\n\n    except Exception as e:\n        return {\n           \
          \ \"output\": json.dumps({\n                \"error\": f\"处理失败: {str(e)}\"\
          \n            }, ensure_ascii=False)\n        }\n\ndef generate_alert_message(level,\
          \ turbidity, trend):\n    \"\"\"生成警报信息\"\"\"\n    if turbidity > 20:\n \
          \       return f\" 严重污染警报！浊度值 {turbidity} NTU 严重超标，请立即处理！\"\n    elif turbidity\
          \ > 10:\n        return f\" 水质超标警报！当前浊度 {turbidity} NTU，趋势 {trend}，建议采取措施。\"\
          \n    else:\n        return None\n"
